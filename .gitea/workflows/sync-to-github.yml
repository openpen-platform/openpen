name: Sync main to GitHub

on:
  push:
    branches: [main]

concurrency:
  group: sync-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Route Gitea hostname to Docker gateway
        env:
          GT_HOST: ${{ secrets.GT_HOST }}
        run: |
          HEX=$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)
          GW=$(printf "%d.%d.%d.%d\n" 0x${HEX:6:2} 0x${HEX:4:2} 0x${HEX:2:2} 0x${HEX:0:2})
          echo "$GW ${GT_HOST}" >> /etc/hosts
          echo "Routed ${GT_HOST} -> $GW"

      - name: Mirror Gitea to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEA_TOKEN: ${{ gitea.token }}
          GT_HOST: ${{ secrets.GT_HOST }}
          GT_PORT: ${{ secrets.GT_PORT }}
        run: |
          git clone --bare \
            "https://oauth2:${GITEA_TOKEN}@${GT_HOST}:${GT_PORT}/openpen-platform/openpen.git" \
            /tmp/repo.git
          git -C /tmp/repo.git push \
            "https://x-access-token:${GH_PAT}@github.com/openpen-platform/openpen.git" \
            refs/heads/main:refs/heads/main
