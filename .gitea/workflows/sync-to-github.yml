name: Sync main to GitHub

on:
  push:
    branches: [main]

concurrency:
  group: sync-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GH_PAT has workflow scope
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT secret not set in Gitea repo Settings -> Actions -> Secrets"
            exit 1
          fi

          RESP=$(curl -sS -i -H "Authorization: Bearer ${GH_PAT}" https://api.github.com/user)
          STATUS_LINE=$(printf '%s\n' "$RESP" | head -1 | tr -d '\r')
          STATUS_CODE=$(printf '%s' "$STATUS_LINE" | awk '{print $2}')
          SCOPES=$(printf '%s\n' "$RESP" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^x-oauth-scopes:/ {sub(/^[^:]*: */,""); print}')
          EXPIRES=$(printf '%s\n' "$RESP" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^github-authentication-token-expiration:/ {sub(/^[^:]*: */,""); print}')
          LOGIN=$(printf '%s\n' "$RESP" | grep -E '^[[:space:]]*"login"' | head -1 | sed 's/.*"login":[[:space:]]*"\([^"]*\)".*/\1/')

          echo "GitHub /user probe:"
          echo "  status:        ${STATUS_LINE}"
          echo "  login:         ${LOGIN:-<none>}"
          echo "  scopes header: ${SCOPES:-<empty>}"
          echo "  expiration:    ${EXPIRES:-<none>}"

          case "${STATUS_CODE}" in
            200)
              if [ -n "${SCOPES}" ]; then
                # Classic PAT: X-OAuth-Scopes lists granted scopes, so the
                # workflow-scope requirement can be pre-flight-checked.
                if ! printf '%s' "${SCOPES}" | grep -qE '(^|, )workflow($|,)'; then
                  echo "::error::Classic PAT for '${LOGIN:-?}' lacks 'workflow' scope (scopes seen: ${SCOPES}). Enable 'workflow' at github.com/settings/tokens and re-paste into Gitea secret GH_PAT."
                  exit 1
                fi
                echo "Verified: classic PAT for '${LOGIN}' has workflow scope."
              else
                # Fine-grained PAT does not advertise scopes via this header
                # (it uses repository-scoped permissions instead). Pre-flight
                # cannot verify 'Workflows: Read and write'; the push itself
                # is the source of truth.
                echo "::warning::No X-OAuth-Scopes header for '${LOGIN:-?}' — likely a fine-grained PAT. Pre-flight scope check skipped; if the GitHub push is rejected with GH013, the token lacks 'Workflows: Read and write' permission on the target repository."
              fi
              ;;
            401)
              echo "::error::Token in Gitea secret GH_PAT is unauthorized (HTTP 401). The value is invalid, expired, or revoked. Re-paste a valid PAT (classic with 'repo'+'workflow', or fine-grained with 'Contents: RW' and 'Workflows: RW') into Gitea secret GH_PAT."
              exit 1
              ;;
            *)
              echo "::error::Unexpected response from api.github.com/user: '${STATUS_LINE}'. Check network connectivity from the Gitea runner and GitHub status."
              exit 1
              ;;
          esac

      - name: Mirror Gitea to GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEA_TOKEN: ${{ gitea.token }}
          GT_HOST: ${{ secrets.GT_HOST }}
        run: |
          set -euo pipefail

          GITEA_URL="https://oauth2:${GITEA_TOKEN}@${GT_HOST}/openpen-platform/openpen.git"

          git clone --branch main --single-branch "$GITEA_URL" /tmp/repo
          cd /tmp/repo
          git config user.email "sync-bot@openpen.local"
          git config user.name "openpen-sync"

          # Basic auth via extraheader (the actions/checkout pattern). github.com's git
          # endpoint expects HTTP Basic for token auth; putting the credential in
          # extraheader instead of the remote URL keeps it out of `git remote -v` and `ps`.
          # The 'x-access-token' username works for both classic PATs (need 'workflow'
          # scope) and fine-grained PATs (need 'Workflows: Read and write' permission on
          # the target repo) when pushing under .github/workflows/.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_PAT}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"

          git remote add github https://github.com/openpen-platform/openpen.git
          git fetch github main

          GITEA_HEAD=$(git rev-parse HEAD)
          GITHUB_HEAD=$(git rev-parse github/main)

          if [ "$GITEA_HEAD" = "$GITHUB_HEAD" ]; then
            echo "Gitea and GitHub main already match — nothing to do."
            exit 0
          fi

          # Fast path: GitHub is an ancestor of Gitea → linear fast-forward
          if git merge-base --is-ancestor github/main HEAD; then
            echo "GitHub main is an ancestor of Gitea main — fast-forward push."
            git push github HEAD:refs/heads/main
            exit 0
          fi

          # Divergence: GitHub has commits Gitea lacks (e.g. PR merged on
          # GitHub side directly). Rebase Gitea-only commits onto github/main
          # so the resulting history stays linear, then sync both ends.
          MERGE_BASE=$(git merge-base HEAD github/main)
          echo "Divergence detected (merge base $MERGE_BASE) — rebasing Gitea commits onto github/main."

          git rebase --onto github/main "$MERGE_BASE" HEAD

          # --force-with-lease pins to the SHA captured at clone time; aborts
          # if Gitea main has moved between clone and push, so a concurrent
          # push is never overwritten.
          git push origin HEAD:refs/heads/main \
            --force-with-lease=refs/heads/main:"$GITEA_HEAD"
          git push github HEAD:refs/heads/main
