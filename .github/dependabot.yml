version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Major bumps are evaluated by a maintainer on a branch, not proposed here.
    # update-types in ignore only filters version updates; security updates
    # still open.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor:
        patterns: ["*"]
        update-types: [minor]
      patch:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
