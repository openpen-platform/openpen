# TODO(e2e-gate): once macOS runner + Playwright Electron setup is ready,
#   add an e2e job here as a release prerequisite (see CLAUDE.md TESTING STANDARD).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write  # required for npm publish --provenance (SLSA attestation)

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_flag: --mac
          - os: windows-latest
            platform: win
            builder_flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Prod smoke test
        run: npm run test:prod-smoke

      - name: Build Electron distributable
        shell: bash
        run: |
          [ -z "${CSC_LINK}" ] && unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder ${{ matrix.builder_flag }} --publish never
        env:
          # Code signing — set these secrets in GitHub repo settings to enable signing.
          # When unset, GitHub Actions passes empty strings; the unset above prevents
          # electron-builder from treating "" as a certificate file path.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/**

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and runtime
        run: npm run build

      - name: Publish workspace packages
        # Root package is private:true and is excluded automatically by --workspaces.
        # --access public required for scoped packages (@openpen/*) on first publish.
        # --provenance attaches a signed SLSA provenance attestation (requires id-token permission).
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@openpen/module-api@${VERSION}" version 2>/dev/null || echo "")
          if [ "${PUBLISHED}" = "${VERSION}" ]; then
            echo "Version ${VERSION} already on npm — skipping publish"
            exit 0
          fi
          npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
