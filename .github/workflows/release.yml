# TODO(e2e-gate): once macOS runner + Playwright Electron setup is ready,
#   add an e2e job here as a release prerequisite (see CLAUDE.md TESTING STANDARD).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write  # required for npm publish --provenance (SLSA attestation)

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: ${{ github.server_url == 'https://github.com' }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_flag: --mac
          - os: windows-latest
            platform: win
            builder_flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Prod smoke test
        run: npm run test:prod-smoke

      - name: Build Electron distributable
        shell: bash
        run: |
          [ -z "${CSC_LINK}" ] && unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder ${{ matrix.builder_flag }} --publish never
        env:
          # Code signing — set these secrets in GitHub repo settings to enable signing.
          # When unset, GitHub Actions passes empty strings; the unset above prevents
          # electron-builder from treating "" as a certificate file path.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  npm-publish:
    name: Publish to npm
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and runtime
        run: npm run build

      - name: Publish workspace packages
        # Iterate each workspace under packages/* and publish independently.
        # Per-package guards: skip private packages, skip already-published versions.
        # A single existing version (e.g. one workspace was already on npm) MUST NOT
        # short-circuit the whole job — that would let new / missing packages silently
        # fall through. --access public required for scoped (@openpen/*) packages.
        # --provenance attaches signed SLSA provenance (requires id-token permission).
        run: |
          EXIT_CODE=0
          for pkg_dir in packages/*/; do
            PKG_JSON="${pkg_dir}package.json"
            [ -f "${PKG_JSON}" ] || continue
            PRIVATE=$(jq -r '.private // false' "${PKG_JSON}")
            if [ "${PRIVATE}" = "true" ]; then
              echo "::group::Skip ${pkg_dir} (private)"
              echo "::endgroup::"
              continue
            fi
            PKG=$(jq -r '.name' "${PKG_JSON}")
            VER=$(jq -r '.version' "${PKG_JSON}")
            echo "::group::${PKG}@${VER}"
            PUBLISHED=$(npm view "${PKG}@${VER}" version 2>/dev/null || echo "")
            if [ "${PUBLISHED}" = "${VER}" ]; then
              echo "${PKG}@${VER} already on npm — skipping"
              echo "::endgroup::"
              continue
            fi
            echo "Publishing ${PKG}@${VER}..."
            if ! npm publish --workspace="${PKG}" --access public --provenance; then
              echo "::error::Failed to publish ${PKG}@${VER}"
              EXIT_CODE=1
            fi
            echo "::endgroup::"
          done
          exit ${EXIT_CODE}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
