name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. openpen@v1.2.0'
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write  # required for npm publish --provenance (SLSA attestation)

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      host_released: ${{ steps.rp.outputs.release_created }}
      host_tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    name: Build (${{ matrix.os }})
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.host_released == 'true' || github.event_name == 'workflow_dispatch') && github.server_url == 'https://github.com' }}
    strategy:
      # Keep building the other platforms even if one leg fails, so a Linux
      # build problem never cancels the macOS / Windows release artifacts.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_flag: --mac
          - os: windows-latest
            platform: win
            builder_flag: --win
          - os: ubuntu-latest
            platform: linux
            builder_flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Prod smoke test
        if: ${{ matrix.platform != 'linux' }}
        run: npm run test:prod-smoke

      # Linux runners are headless; the prod-smoke launches a real Electron
      # window, so it needs a virtual X display. launchElectronAppProd forces
      # the standard (X11) path, so the smoke runs for real under Xvfb.
      - name: Prod smoke test (Xvfb)
        if: ${{ matrix.platform == 'linux' }}
        run: xvfb-run --auto-servernum npm run test:prod-smoke

      - name: Build Electron distributable
        shell: bash
        run: |
          [ -z "${CSC_LINK}" ] && unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder ${{ matrix.builder_flag }} --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || needs.release-please.outputs.host_tag }}
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
            release/latest*.yml
            release/*.blockmap

  npm-publish:
    name: Publish to npm
    needs: release-please
    # Package release-PR merges create no GitHub Release (skip-github-release:
    # SDK packages are npm-only per spec), so releases_created stays false for
    # them — the head-commit check keeps npm publish firing on those merges.
    if: "${{ always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release')) && github.server_url == 'https://github.com' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and runtime
        run: npm run build

      - name: Publish workspace packages
        # Iterate each workspace under packages/* and publish independently.
        # Per-package guards: skip private packages, skip already-published versions.
        # A single existing version (e.g. one workspace was already on npm) MUST NOT
        # short-circuit the whole job — that would let new / missing packages silently
        # fall through. --access public required for scoped (@openpen/*) packages.
        # --provenance attaches signed SLSA provenance (requires id-token permission).
        run: |
          EXIT_CODE=0
          for pkg_dir in packages/*/; do
            PKG_JSON="${pkg_dir}package.json"
            [ -f "${PKG_JSON}" ] || continue
            PRIVATE=$(jq -r '.private // false' "${PKG_JSON}")
            if [ "${PRIVATE}" = "true" ]; then
              echo "::group::Skip ${pkg_dir} (private)"
              echo "::endgroup::"
              continue
            fi
            PKG=$(jq -r '.name' "${PKG_JSON}")
            VER=$(jq -r '.version' "${PKG_JSON}")
            echo "::group::${PKG}@${VER}"
            PUBLISHED=$(npm view "${PKG}@${VER}" version 2>/dev/null || echo "")
            if [ "${PUBLISHED}" = "${VER}" ]; then
              echo "${PKG}@${VER} already on npm — skipping"
              echo "::endgroup::"
              continue
            fi
            echo "Publishing ${PKG}@${VER}..."
            if ! npm publish --workspace="${PKG}" --access public --provenance; then
              echo "::error::Failed to publish ${PKG}@${VER}"
              EXIT_CODE=1
            fi
            echo "::endgroup::"
          done
          exit ${EXIT_CODE}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
