name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit tests
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Prod-smoke is the same gate that release.yml runs before signing the
  # build — it catches dev/prod parity regressions (build-runtime SFC styles,
  # importmap resolution, asar quirks) that the dev server can't reproduce.
  # The full Playwright + Electron suite (~4 min, 111 specs) is intentionally
  # NOT gated here yet; it would multiply CI minutes per PR. Promote it to a
  # gate after a soak window if smoke proves stable.
  e2e-smoke:
    name: E2E prod smoke
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:prod-smoke
