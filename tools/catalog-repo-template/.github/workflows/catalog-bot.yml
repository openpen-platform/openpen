name: Catalog Bot

on:
  pull_request_target:
    paths:
      - 'plugins/**/manifest.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Checkout PR files (manifests only)
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- plugins/

      - name: Detect PR type (Registration vs Update)
        id: pr_type
        run: |
          # A Registration PR adds a manifest.json that did not exist on base.
          CHANGED=$(git diff origin/${{ github.base_ref }}...pr-head --name-only -- 'plugins/**/manifest.json')
          REGISTRATION=false
          for f in $CHANGED; do
            if ! git show origin/${{ github.base_ref }}:$f >/dev/null 2>&1; then
              REGISTRATION=true
              break
            fi
          done
          echo "is_registration=$REGISTRATION" >> "$GITHUB_OUTPUT"
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate manifest(s)
        id: validate
        run: |
          node scripts/validate-manifest.mjs \
            --files "${{ steps.pr_type.outputs.changed_files }}" \
            --pr-author "${{ github.event.pull_request.user.login }}" \
            --is-registration "${{ steps.pr_type.outputs.is_registration }}" \
            --base-ref "${{ github.base_ref }}" \
            > validate-result.json 2>&1 || true
          cat validate-result.json

      - name: Post validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const result = JSON.parse(fs.readFileSync('validate-result.json', 'utf-8'))
            const icon = result.passed ? '✅' : '❌'
            const lines = result.checks.map(c =>
              `- [${c.passed ? 'x' : ' '}] ${c.name}${c.message ? ': ' + c.message : ''}`
            )
            const body = [
              `## Catalog Bot — ${icon} ${result.passed ? 'Validation passed' : 'Validation failed'}`,
              '',
              ...lines,
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
            if (!result.passed) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                state: 'closed',
              })
              core.setFailed('Manifest validation failed — PR closed.')
            }

      - name: Auto-merge Update PRs
        if: >
          steps.pr_type.outputs.is_registration == 'false' &&
          steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --repo ${{ github.repository }} \
            --auto
